spec_version: 1
name: dba_tuner_env
type: space
runtime: fastapi
app: server.app:app
port: 8000
description: >
  DBA-Tuner-Env: An AI agent acts as a Database Administrator optimising
  DuckDB analytical query performance across 3 difficulty levels.
  The agent must rewrite inefficient SQL (redundant UNION ALL scans,
  correlated subqueries, heavy aggregations) into efficient equivalents,
  graded by deterministic physical execution-tree complexity reduction.
  Features a Pareto-skewed (α=1.1) e-commerce dataset, continuous reward
  signal, and a 5-second SQL timeout sandbox.
tags:
  - DBA
  - SQL-Optimization
  - DuckDB
  - Efficiency
  - database
  - performance
  - rl-environment
memory: 2GB
cpus: 2
