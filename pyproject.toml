[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-dba_tuner_env"
version = "0.1.0"
description = "Dba Tuner Env environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    # install from github
    # "openenv-core[core] @ git+https://github.com/meta-pytorch/OpenEnv.git",
    "openenv-core[cli,core]>=0.2.2",
    # Environment-specific dependencies
    "duckdb>=1.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m dba_tuner_env.server.app
server = "dba_tuner_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["dba_tuner_env", "dba_tuner_env.server"]
package-dir = { "dba_tuner_env" = ".", "dba_tuner_env.server" = "server" }
